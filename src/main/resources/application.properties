spring.application.name=ccp_api
server.port=8080

# Database (H2 file-based so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/carepdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# JWT
app.jwt.secret=this-is-a-secret-key-for-the-api
app.jwt.expiration-ms=3600000

# Webhook signing
app.webhook.secret=this-is-a-secret-key-for-webhook-signing

spring.security.user.name=admin
spring.security.user.password=admin123